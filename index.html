<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search and filter news from The Guardian, The New York Times and NewsAPI in one personalised feed."
    />
    <title>Newsstand — News Aggregator</title>
    <!-- Applies the stored theme before first paint, so there is no flash of
         the wrong one. Anything other than an explicit light/dark choice —
         "system", or nothing stored yet — follows the operating system. -->
    <script>
      try {
        var choice = localStorage.getItem('newsstand.theme')
        var dark =
          choice === 'dark' ||
          (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <!-- Fonts are self-hosted (src/fonts.css, public/fonts) so the container
         has no third-party runtime dependency. Preload the two Latin faces that
         are needed for first paint. -->
    <link
      rel="preload"
      href="/fonts/fraunces-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
