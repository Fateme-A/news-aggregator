<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search and filter news from The Guardian, The New York Times and NewsAPI in one personalised feed."
    />
    <title>Newsstand — News Aggregator</title>
    <script>
      try {
        var theme = localStorage.getItem('newsstand.theme')
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        if (theme === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <!-- Fonts are self-hosted (src/fonts.css, public/fonts) so the container
         has no third-party runtime dependency. Preload the two Latin faces that
         are needed for first paint. -->
    <link
      rel="preload"
      href="/fonts/fraunces-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
