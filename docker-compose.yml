services:
  newsstand:
    build: .
    image: newsstand
    # Override the host side when 8080 is taken: `HOST_PORT=8090 docker compose up`.
    ports:
      - '${HOST_PORT:-8080}:8080'
    # Keys are supplied at run time and never baked into the image. The file is
    # optional so a first `docker compose up --build` works before it exists:
    # every provider then serves its recorded sample. Needs Compose v2.24+.
    env_file:
      - path: .env.local
        required: false
    restart: unless-stopped
